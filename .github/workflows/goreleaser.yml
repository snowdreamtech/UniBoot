---
# UniBoot secure release pipeline.

name: "📦 UniBoot Release"

"on":
  push:
    tags:
      - "v*"
      - "V*"
      - "[0-9]*"
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "1"

jobs:
  release:
    name: "📦 Build and secure UniBoot release"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: uniboot-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: "📂 Checkout repository"
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "🔍 Verify release ref"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          test "$(git tag --points-at HEAD | grep -Fx "$tag")" = "$tag"

      - name: "📦 Install Cosign"
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: "📦 Install Syft"
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: "🚀 Run GoReleaser"
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean --timeout 30m' || 'release --snapshot --clean --skip=publish --timeout 30m' }}
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: "🔐 Secure release assets"
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(ipxe/*.efi ipxe/*.lkrn ipxe/*.kpxe ipxe/*.ipxe ipxe/*.png iso/*.iso)
          test "${#assets[@]}" -gt 0
          mkdir -p dist/security
          : > dist/security/release-artifacts.sha256
          for asset in "${assets[@]}"; do
            base="$(basename "$asset")"
            sha256sum "$asset" >> dist/security/release-artifacts.sha256
            syft "file:$asset" -o "spdx-json=dist/security/${base}.sbom.spdx.json"
            cosign sign-blob --yes --bundle "dist/security/${base}.sigstore.json" "$asset"
            cosign verify-blob \
              --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "dist/security/${base}.sigstore.json" \
              "$asset"
          done
          sha256sum --check dist/security/release-artifacts.sha256

      - name: "📜 Attest release artifact provenance"
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/security/release-artifacts.sha256

      - name: "📤 Upload security evidence"
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            dist/security/*

  rollback:
    if: ${{ always() && needs.release.result == 'failure' && startsWith(github.ref, 'refs/tags/') }}
    needs: [release]
    name: "🧹 Roll back failed release"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: "🧹 Delete partial release"
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
          fi
