---
# GoReleaser (Build & Release Automation for Uniboot)
# Purpose: Orchestrates the compilation, packaging, and distribution of Uniboot Go binaries, EFI, and LKRN assets.
# Trigger: Automated on specific version tags (v*); manually via workflow_dispatch for snapshots.

name: "📦 GoReleaser"

"on":
  push:
    tags:
      - "v*"
      - "V*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  statuses: write

jobs:
  goreleaser:
    name: "📦 Distribution Packaging"
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Checkout Repository Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: "⚡ Setup Go"
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: "stable"
          cache: true

      - name: "🚀 Distribute Artifacts (GoReleaser)"
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          distribution: goreleaser
          version: "~> v2"
          args: ${{ startsWith(github.ref, 'refs/tags/') && 'release --clean' || 'release --snapshot --clean --skip=publish' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
