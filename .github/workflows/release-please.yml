---
# Release Please (Automated Release PR & Version Management)
# Purpose: Automatically generates release PRs, updates CHANGELOG.md, and creates git tags upon merging to main.

name: "🤖 Release Please"

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: "🤖 Release Please Automation"
    runs-on: ubuntu-latest
    steps:
      - name: "📝 Orchestrate Release Lifecycle (Release Please)"
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.1.3
        with:
          token: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
