---
# iPXE Multi-Arch Compilation (EFI + LKRN)
# Purpose: Cross-compiles omni-architecture EFI binaries and LKRN kernel payloads with embedded UniBoot scripts.
# Trigger: Manually via workflow_dispatch for testing or artifact generation (never auto-commits to repo).

name: "🔨 Build iPXE Binaries (EFI + LKRN)"

"on":
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: "🔨 Multi-Arch iPXE Compilation"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: uniboot-ipxe-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: "📂 Checkout Repository Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: "🛠️ Install Cross-Compilers and Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libc6-dev \
            gcc-i686-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            gcc-riscv64-linux-gnu \
            make perl liblzma-dev mtools git ca-certificates libssl-dev
          sudo apt-get install -y \
              gcc-13-loongarch64-linux-gnu || sudo apt-get install -y gcc-loongarch64-linux-gnu
          if command -v loongarch64-linux-gnu-gcc-13 >/dev/null 2>&1; then
            sudo ln -sf "$(command -v loongarch64-linux-gnu-gcc-13)" /usr/bin/loongarch64-linux-gnu-gcc
          elif ! command -v loongarch64-linux-gnu-gcc >/dev/null 2>&1; then
            echo "LoongArch64 cross-compiler installation failed."
            exit 1
          fi

      - name: "🔨 Build Multi-Arch iPXE Binaries"
        run: |
          bash scripts/build_ipxe_binaries.sh

      - name: "📦 Upload Compiled iPXE Binaries as Artifact"
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: ipxe-binaries
          path: |
            ipxe/*.efi
            ipxe/*.lkrn
            ipxe/*.kpxe
          retention-days: 14
