# UniBoot Ventoy Custom GRUB Menu Configuration
# Press F6 in Ventoy main menu to access custom menu entries

# --- Ensure Video Drivers & GOP Framebuffer Compatibility ---
insmod all_video
insmod gfxterm
set gfxmode=1280x800,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm

# --- i18n Localization Engine ---
if [ -z "${lang}" ]; then
    set lang=zh_CN
fi

if [ "${lang}" = "zh_CN" -o "${lang}" = "zh_TW" -o "${lang}" = "zh_HK" ]; then
    set lbl_netboot_uefi="Netboot.xyz UEFI (网络安装 - UEFI 模式)"
    set lbl_netboot_bios="Netboot.xyz Legacy BIOS (网络安装 - BIOS 模式)"
    set lbl_return="<-- 返回 Ventoy 主菜单"
else
    set lbl_netboot_uefi="Netboot.xyz UEFI (Network Boot - UEFI Mode)"
    set lbl_netboot_bios="Netboot.xyz Legacy BIOS (Network Boot - BIOS Mode)"
    set lbl_return="<-- Return to Main Menu"
fi

if [ "$grub_platform" = "efi" ]; then
    menuentry "$lbl_netboot_uefi" --class netboot {
        search --no-floppy --set=root --file /netboot/ipxe.efi
        linux /netboot/ipxe.efi
        initrd /netboot/boot.ipxe
    }
else
    menuentry "$lbl_netboot_bios" --class netboot {
        search --no-floppy --set=root --file /netboot/ipxe.lkrn
        linux16 /netboot/ipxe.lkrn
        initrd16 /netboot/boot.ipxe
    }
fi

menuentry "$lbl_return" --class=vtoyret VTOY_RET {
    echo 'Return ...'
}
