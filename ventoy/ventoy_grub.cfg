# UniBoot Ventoy Custom GRUB Menu Configuration
# Press F6 in Ventoy main menu to access custom menu entries

if [ "$grub_platform" = "efi" ]; then
    menuentry "Netboot.xyz UEFI (网络安装 - UEFI 模式)" --class netboot {
        chainloader ($vtoy_iso_part)/netboot/netboot.xyz.efi
    }
else
    menuentry "Netboot.xyz Legacy BIOS (网络安装 - BIOS 模式)" --class netboot {
        linux16 ($vtoy_iso_part)/netboot/netboot.xyz.lkrn
    }
fi

menuentry "<-- 返回 Ventoy 主菜单 [Return to Main Menu]" --class=vtoyret VTOY_RET {
    echo 'Return ...'
}
