# UniBoot Ventoy Custom GRUB Menu Configuration
# Press F6 in Ventoy main menu to access custom menu entries

if [ "$grub_platform" = "efi" ]; then
    menuentry "Netboot.xyz UEFI (网络安装 - UEFI 模式)" --class netboot {
        echo "Loading Netboot.xyz EFI..."
        chainloader /netboot/netboot.xyz.efi
    }
else
    menuentry "Netboot.xyz Legacy BIOS (网络安装 - Legacy BIOS 模式)" --class netboot {
        echo "Loading Netboot.xyz iPXE..."
        linux16 /netboot/netboot.xyz.lkrn
    }
fi
